# Render.com Blueprint — free-tier web service.
# Push this repo to GitHub, then in Render: New -> Blueprint -> pick the repo.
#
# NOTE on the database: Render's free web services have an EPHEMERAL disk —
# it's wiped on every redeploy/restart (including the free plan's automatic
# sleep/wake). Set DATABASE_URL below (a free Neon — https://neon.tech —
# connection string works) and the app automatically uses Postgres instead
# of the local SQLite file, so data survives restarts. See src/db.js and the
# README for details. Leave DATABASE_URL unset only for throwaway testing.

services:
  - type: web
    name: flowmember
    env: node
    plan: free
    buildCommand: "npm install"
    startCommand: "node src/server.js"
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false
