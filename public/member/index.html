<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Account — FlowMember</title>
<style>
  :root {
    --border: #e2e2e2;
    --muted: #666;
    --accent: #2d6cdf;
    --accent-dark: #1f52ac;
    --bg-soft: #f7f9fc;
    --ink: #1b1b1b;
    --danger: #c0392b;
    --danger-bg: #fdecea;
    --ok-bg: #eef2fb;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    color: var(--ink);
    background: var(--bg-soft);
  }
  a { color: var(--accent); text-decoration: none; }

  header.topbar {
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .logo { font-weight: 700; font-size: 17px; color: var(--ink); }
  .logo .site-name { color: var(--muted); font-weight: 400; }

  .container { max-width: 560px; margin: 0 auto; padding: 32px 20px 60px; }

  h1 { font-size: 20px; margin: 0; }
  h2 { font-size: 15px; margin: 0 0 14px; display: flex; align-items: center; gap: 8px; }

  label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
  input, select, button { font: inherit; padding: 9px 11px; border: 1px solid var(--border); border-radius: 6px; }
  input, select { width: 100%; margin-bottom: 10px; }
  button { background: var(--accent); color: #fff; border: none; cursor: pointer; font-weight: 600; transition: background .15s ease; }
  button:hover:not(:disabled) { background: var(--accent-dark); }
  button.secondary { background: #fff; color: var(--accent); border: 1px solid var(--accent); }
  button.secondary:hover:not(:disabled) { background: var(--ok-bg); }
  button.ghost { background: transparent; color: var(--muted); border: none; font-weight: 500; padding: 6px 8px; }
  button.ghost:hover:not(:disabled) { color: var(--ink); background: transparent; }
  button:disabled { opacity: .55; cursor: default; }

  .card { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 20px; box-shadow: 0 1px 2px rgba(0,0,0,.03); }
  .muted { color: var(--muted); font-size: 13px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row.between { justify-content: space-between; }
  .error { color: var(--danger); font-size: 13px; margin: 2px 0 8px; }
  .error:empty { margin: 0; }
  .empty-state { text-align: center; color: var(--muted); font-size: 14px; padding: 16px 0; }

  .badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 999px; background: var(--ok-bg); color: var(--accent); text-transform: capitalize; }

  .avatar {
    width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700;
    flex-shrink: 0;
  }

  #welcome-view, #app-view, #fatal-view { display: none; }

  .auth-card { max-width: 400px; margin: 48px auto 0; }
  .auth-card h1 { text-align: center; margin-bottom: 4px; }
  .auth-sub { text-align: center; margin: 0 0 20px; }
  .tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
  .tab-btn {
    flex: 1; background: none; border: none; color: var(--muted); padding: 10px;
    border-radius: 0; font-weight: 600; border-bottom: 2px solid transparent;
  }
  .tab-btn:hover:not(:disabled) { background: none; color: var(--ink); }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .profile-row { display: flex; align-items: center; gap: 14px; margin-bottom: 4px; }
  .profile-row .info { flex: 1; }
  .profile-row .email { font-weight: 600; font-size: 15px; }

  .content-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .content-item:last-child { border-bottom: none; }
  .content-item .key-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .content-item .key { font-weight: 600; font-size: 14px; }
  .content-item .body-preview { font-size: 13px; color: var(--ink); background: #f7f7f7; border-radius: 6px; padding: 8px 10px; margin-top: 6px; }
  .lock-badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--danger-bg); color: var(--danger); }

  .upgrade-card { text-align: center; }
  .upgrade-card button { width: 100%; margin-top: 4px; }
</style>
</head>
<body>

<header class="topbar">
  <span class="logo">FlowMember <span class="site-name" id="topbar-site-name"></span></span>
  <div class="row" id="topbar-account" style="display:none">
    <button class="ghost" id="logout-btn">Log out</button>
  </div>
</header>

<div class="container">

<div id="fatal-view">
  <div class="card">
    <h1>Missing site</h1>
    <p class="muted">This link is missing a <code>?site=</code> parameter. Ask the site owner for the correct member dashboard link.</p>
  </div>
</div>

<div id="auth-view">
  <div class="card auth-card">
    <h1>Sign in</h1>
    <p class="muted auth-sub" id="auth-sub">Access your account.</p>

    <div class="tabs">
      <button class="tab-btn active" id="tab-login-btn" type="button">Log in</button>
      <button class="tab-btn" id="tab-signup-btn" type="button">Sign up</button>
    </div>

    <div class="tab-panel active" id="tab-login">
      <label for="login-email">Email</label>
      <input id="login-email" type="email" placeholder="you@example.com">
      <label for="login-password">Password</label>
      <input id="login-password" type="password" placeholder="Your password">
      <div id="login-error" class="error"></div>
      <button id="login-btn" style="width:100%">Log in</button>
    </div>

    <div class="tab-panel" id="tab-signup">
      <label for="signup-email">Email</label>
      <input id="signup-email" type="email" placeholder="you@example.com">
      <label for="signup-password">Password</label>
      <input id="signup-password" type="password" placeholder="Min 8 characters">
      <div id="signup-error" class="error"></div>
      <button id="signup-btn" style="width:100%">Create account</button>
    </div>
  </div>
</div>

<div id="app-view">

  <div class="card">
    <div class="profile-row">
      <span class="avatar" id="profile-avatar"></span>
      <div class="info">
        <div class="email" id="profile-email"></div>
        <span class="muted" id="profile-since"></span>
      </div>
      <span class="badge" id="profile-plan"></span>
    </div>
  </div>

  <div class="card">
    <h2>Your content</h2>
    <div id="content-list"></div>
    <p class="empty-state" id="content-empty" style="display:none">Nothing has been set up here yet.</p>
  </div>

  <div class="card upgrade-card">
    <h2 style="justify-content:center">Want more?</h2>
    <p class="muted">Ask the site owner about upgrading your plan for access to more content.</p>
    <button class="secondary" disabled>Upgrade — coming soon</button>
  </div>

</div>

</div>

<script>
const API = ''; // same origin as this page
const SITE_KEY = new URLSearchParams(window.location.search).get('site');
const TOKEN_KEY = SITE_KEY ? `fm_member_token_${SITE_KEY}` : null;
let token = TOKEN_KEY ? localStorage.getItem(TOKEN_KEY) : null;
let currentMember = null;

function authHeaders() {
  return token ? { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' } : { 'Content-Type': 'application/json' };
}

async function req(path, options = {}) {
  const res = await fetch(API + path, { ...options, headers: { ...authHeaders(), ...(options.headers || {}) } });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

async function withLoading(btn, busyLabel, fn) {
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = busyLabel;
  try {
    await fn();
  } finally {
    btn.disabled = false;
    btn.textContent = original;
  }
}

function show(view) {
  document.getElementById('fatal-view').style.display = view === 'fatal' ? 'block' : 'none';
  document.getElementById('auth-view').style.display = view === 'auth' ? 'block' : 'none';
  document.getElementById('app-view').style.display = view === 'app' ? 'block' : 'none';
  document.getElementById('topbar-account').style.display = view === 'app' ? 'flex' : 'none';
}

function selectTab(tab) {
  const isLogin = tab === 'login';
  document.getElementById('tab-login-btn').classList.toggle('active', isLogin);
  document.getElementById('tab-signup-btn').classList.toggle('active', !isLogin);
  document.getElementById('tab-login').classList.toggle('active', isLogin);
  document.getElementById('tab-signup').classList.toggle('active', !isLogin);
}
document.getElementById('tab-login-btn').onclick = () => selectTab('login');
document.getElementById('tab-signup-btn').onclick = () => selectTab('signup');

document.getElementById('login-btn').onclick = async () => {
  const btn = document.getElementById('login-btn');
  const email = document.getElementById('login-email').value;
  const password = document.getElementById('login-password').value;
  document.getElementById('login-error').textContent = '';
  await withLoading(btn, 'Logging in…', async () => {
    try {
      const data = await req(`/api/m/${SITE_KEY}/login`, { method: 'POST', body: JSON.stringify({ email, password }) });
      token = data.token;
      localStorage.setItem(TOKEN_KEY, token);
      currentMember = data.member;
      boot();
    } catch (e) {
      document.getElementById('login-error').textContent = e.message;
    }
  });
};

document.getElementById('signup-btn').onclick = async () => {
  const btn = document.getElementById('signup-btn');
  const email = document.getElementById('signup-email').value;
  const password = document.getElementById('signup-password').value;
  document.getElementById('signup-error').textContent = '';
  await withLoading(btn, 'Creating account…', async () => {
    try {
      const data = await req(`/api/m/${SITE_KEY}/signup`, { method: 'POST', body: JSON.stringify({ email, password }) });
      token = data.token;
      localStorage.setItem(TOKEN_KEY, token);
      currentMember = data.member;
      boot();
    } catch (e) {
      document.getElementById('signup-error').textContent = e.message;
    }
  });
};

document.getElementById('logout-btn').onclick = () => {
  token = null;
  currentMember = null;
  localStorage.removeItem(TOKEN_KEY);
  show('auth');
};

async function loadSiteName() {
  try {
    const data = await req(`/api/m/${SITE_KEY}/site`);
    document.getElementById('topbar-site-name').textContent = `— ${data.name}`;
    document.getElementById('auth-sub').textContent = `Access your ${data.name} account.`;
  } catch (e) {
    // cosmetic only — don't block the page over it
  }
}

function renderProfile() {
  document.getElementById('profile-avatar').textContent = currentMember.email[0].toUpperCase();
  document.getElementById('profile-email').textContent = currentMember.email;
  document.getElementById('profile-plan').textContent = currentMember.plan;
  document.getElementById('profile-since').textContent = currentMember.createdAt
    ? `Member since ${new Date(currentMember.createdAt).toLocaleDateString()}`
    : '';
}

async function loadContent() {
  const data = await req(`/api/m/${SITE_KEY}/content`);
  const list = document.getElementById('content-list');
  list.innerHTML = '';
  document.getElementById('content-empty').style.display = data.blocks.length ? 'none' : '';
  data.blocks.forEach((b) => {
    const div = document.createElement('div');
    div.className = 'content-item';
    div.innerHTML = `
      <div class="key-row">
        <span class="key">${b.key}</span>
        ${b.unlocked ? '' : `<span class="lock-badge">Requires ${b.planRequired} plan</span>`}
      </div>
      ${b.unlocked ? `<div class="body-preview">${b.body || '<em>Empty</em>'}</div>` : ''}
    `;
    list.appendChild(div);
  });
}

async function boot() {
  if (!SITE_KEY) return show('fatal');
  loadSiteName();
  if (!token) return show('auth');
  try {
    const data = await req(`/api/m/${SITE_KEY}/me`);
    currentMember = data.member;
    renderProfile();
    await loadContent();
    show('app');
  } catch (e) {
    token = null;
    localStorage.removeItem(TOKEN_KEY);
    show('auth');
  }
}

boot();
</script>
</body>
</html>
